name: Refresh app screenshots

# Regenerates every app screenshot on the site from the live apps and opens a PR
# if anything changed. Never commits straight to the default branch — a human
# reviews the image diff first (the in-play capture can occasionally need a
# re-run, so nothing bad should ship unreviewed).
#
# Triggers: nightly, or on demand from the Actions tab.
#
# Requires one repo secret — APP_REPOS_TOKEN — a token that can READ
# loanst1/stroke-sight and loanst1/rewrite (a fine-grained PAT scoped to those
# two repos with Contents: read is enough). The PR itself is opened with the
# built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC nightly

concurrency:
  group: screenshots
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out Stroke Sight
        uses: actions/checkout@v4
        with:
          repository: loanst1/stroke-sight
          token: ${{ secrets.APP_REPOS_TOKEN }}
          path: _apps/stroke-sight

      - name: Check out ReWrite
        uses: actions/checkout@v4
        with:
          repository: loanst1/rewrite
          token: ${{ secrets.APP_REPOS_TOKEN }}
          path: _apps/rewrite

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/screenshots
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Regenerate screenshots
        working-directory: tools/screenshots
        env:
          SITE: ${{ github.workspace }}
          SS_APP: file://${{ github.workspace }}/_apps/stroke-sight/www/app.html
          RW_APP: file://${{ github.workspace }}/_apps/rewrite/www/app.html
        run: npm run all

      - name: Drop the app checkouts (not part of the site)
        run: rm -rf _apps

      - name: Open a PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: screenshots/auto-refresh
          delete-branch: true
          title: Refresh app screenshots
          commit-message: Refresh app screenshots from the live apps
          author: Liam Anstey <liam.anstey@gmail.com>
          body: |
            Automated screenshot refresh (hero phones, tablet showcase, product
            strip) rendered from the current Stroke Sight and ReWrite apps.

            Review the image diff before merging — the Anchor & Scan in-play
            capture is timing-based and can occasionally render an empty field;
            if a locale looks off, re-run `node product-strip.mjs <lang>` locally
            and push to this branch.
          add-paths: |
            assets/hero/*.png
            assets/tablets/*.png
            stroke-sight-screenshots/**/*.png
            rewrite-screenshots/**/*.png
